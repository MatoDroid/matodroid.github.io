<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Chránená stránka</title>
<style>body{font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;background:#f4f4f4}form{background:#fff;padding:24px;border-radius:10px;box-shadow:0 2px 12px #0002;display:flex;gap:8px;flex-direction:column;min-width:260px}input,button{font:inherit;padding:8px}#e{color:#c00;min-height:1.2em;font-size:14px}</style></head>
<body><form id="f"><b>Zadajte heslo</b><input id="p" type="password" autocomplete="current-password" autofocus><button>Otvoriť</button><div id="e"></div></form>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault(); const e = document.getElementById('e'), pw = document.getElementById('p').value; e.textContent = 'Dešifrujem…';
  try {
    const buf = new Uint8Array(await (await fetch('app.enc', { cache: 'no-store' })).arrayBuffer());
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: buf.slice(0, 16), iterations: 600000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(16, 28) }, key, buf.slice(28)));
    window.__gumaPw = pw; document.open(); document.write(html); document.close();
  } catch (_) { e.textContent = 'Nesprávne heslo.'; }
};
</script></body></html>
