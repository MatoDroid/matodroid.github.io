<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa s kreslením, cestami a exportom</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        #map {
            width: 100%;
            height: 100%;
        }

        #controls-container {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
            font: 13px/1.4 Arial, Helvetica, sans-serif;
            max-width: 250px;
            box-sizing: border-box;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
        }

        #controls-toggle {
            display: block;
            width: 100%;
            margin-bottom: 8px;
            padding: 4px 6px;
            cursor: pointer;
        }

        #controls-container.collapsed #controls-body {
            display: none;
        }

        #controls-container.collapsed {
            padding: 6px;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .control-row label {
            flex: 0 0 60px;
        }

        .control-row input[type="range"] {
            flex: 1 1 auto;
            min-width: 60px;
            width: 100%;
        }

        .opacity-value {
            flex: 0 0 26px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .control-row.checkbox-row label {
            flex: 1 1 auto;
        }

        #controls-body button {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 5px 6px;
            cursor: pointer;
            font-size: inherit;
        }

        /* Stavové hlásenia a indikátor načítania */
        #map-status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            max-width: 90%;
        }

        #map-status > div {
            padding: 6px 12px;
            border-radius: 4px;
            font: 13px/1.4 Arial, Helvetica, sans-serif;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
        }

        #roads-loading {
            background-color: rgba(255, 255, 255, 0.95);
            color: #333;
            display: none;
            align-items: center;
            gap: 8px;
        }

        #roads-loading.visible {
            display: flex;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #ccc;
            border-top-color: #337ab7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #map-message {
            display: none;
            text-align: center;
        }

        #map-message.visible {
            display: block;
        }

        #map-message.info {
            background-color: rgba(255, 250, 210, 0.97);
            color: #6b5a00;
            border: 1px solid #e0d48a;
        }

        #map-message.error {
            background-color: rgba(255, 226, 226, 0.97);
            color: #8a1f1f;
            border: 1px solid #e09a9a;
        }

        /* Mobil – ovládací panel nesmie zaberať veľkú časť mapy */
        @media (max-width: 600px) {
            #controls-container {
                top: 6px;
                right: 6px;
                padding: 6px;
                max-width: 62vw;
                font-size: 12px;
                border-radius: 4px;
            }

            .control-row {
                gap: 4px;
                margin-bottom: 4px;
            }

            .control-row label {
                flex-basis: 46px;
            }

            .opacity-value {
                flex-basis: 22px;
            }

            #controls-body button {
                margin-top: 4px;
                padding: 4px;
            }

            #map-status > div {
                font-size: 12px;
                padding: 5px 10px;
            }
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="controls-container">
    <button id="controls-toggle" type="button" aria-expanded="true">Ovládanie ▲</button>
    <div id="controls-body">
        <div class="control-row">
            <label for="opacity-osm">OSM</label>
            <input type="range" id="opacity-osm" min="0" max="1" step="0.1" value="0">
            <span class="opacity-value" id="opacity-osm-value">0.0</span>
        </div>
        <div class="control-row">
            <label for="opacity-roads">Cesty</label>
            <input type="range" id="opacity-roads" min="0" max="1" step="0.1" value="1">
            <span class="opacity-value" id="opacity-roads-value">1.0</span>
        </div>
        <div class="control-row">
            <label for="opacity-ortov1">OrtoV1</label>
            <input type="range" id="opacity-ortov1" min="0" max="1" step="0.1" value="1">
            <span class="opacity-value" id="opacity-ortov1-value">1.0</span>
        </div>
        <div class="control-row checkbox-row">
            <input type="checkbox" id="toggle-baselayer" checked>
            <label for="toggle-baselayer">Podklad Freemap</label>
        </div>
        <button id="reload-roads" type="button">Načítať cesty</button>
        <button id="export-geojson" type="button">Export do GeoJSON</button>
        <button id="export-gpx" type="button">Export do GPX</button>
        <button id="clear-drawings" type="button">Vymazať kresby</button>
    </div>
</div>

<div id="map-status">
    <div id="roads-loading"><span class="spinner"></span><span id="roads-loading-text">Načítavam cesty...</span></div>
    <div id="map-message"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/osmtogeojson@3.0.0-beta.5/osmtogeojson.min.js"></script>

<script>
    // ---------------------------------------------------------------------
    // Konštanty
    // ---------------------------------------------------------------------

    // Mapa dovoľuje priblíženie až na 22 (kvôli presnému kresleniu), jednotlivé
    // dlaždicové vrstvy majú vlastný maxNativeZoom podľa toho, čo server reálne
    // poskytuje – nad ním Leaflet dlaždice len zväčší namiesto sťahovania 404.
    var MAP_MAX_ZOOM = 22;

    // Reálne maximálne priblíženie podkladových serverov:
    //  - Freemap ofmozaika: z20 (mozaika bola rozšírená z 19 na 20)
    //  - OSM standard tiles: z19 (limit tile.openstreetmap.org)
    //  - ArcGIS OrtoV1: predvolene 20, presnú hodnotu dočítame z metadát služby
    var FREEMAP_MAX_NATIVE_ZOOM = 20;
    var OSM_MAX_NATIVE_ZOOM = 19;
    var ORTOV1_MAX_NATIVE_ZOOM = 20;

    // Overpass – všetky zrkadlá sa volajú NARAZ a vyhráva prvá odpoveď.
    // Sekvenčné skúšanie znamenalo čakať celý timeout na prvom serveri
    // (overpass-api.de má najdlhšiu frontu) a až potom skúsiť záložný.
    var OVERPASS_ENDPOINTS = [
        "https://overpass-api.de/api/interpreter",
        "https://overpass.kumi.systems/api/interpreter"
    ];

    // Timeout na jedno zrkadlo. Zrkadlá bežia paralelne, takže dlhší strop
    // nič nestojí na rýchlom pripojení – uplatní sa len keď treba naozaj
    // čakať (pomalá mobilná sieť), inak vyhrá prvá odpoveď dávno predtým.
    var OVERPASS_TIMEOUT_MS = 25000;

    // Ak Network Information API hlási takto pomalé/šetriace pripojenie,
    // rovno preskočíme ťažší dopyt s chodníkmi a pýtame len hlavné cesty –
    // ušetrí to celý jeden márny 25 s pokus pred odľahčeným retry.
    var SLOW_CONNECTION_TYPES = ["slow-2g", "2g"];

    // Nad touto plochou cesty nenačítavame (Overpass by to neuniesol).
    // Kontroluje sa plocha, ktorú reálne sťahujeme, teda AJ s rozšírením.
    // Dopyt s chodníkmi je oveľa ťažší, preto má prísnejší limit než dopyt
    // len na hlavné cesty, ktoré sú v teréne riedke.
    var MAX_BBOX_AREA_KM2 = 15;
    var MAX_BBOX_AREA_KM2_MAJOR = 60;

    // Pod týmto priblížením sťahujeme len hlavné cesty. Chodníky, chodníčky,
    // účelové a servisné cesty tvoria väčšinu dát a pri oddialení sú aj tak
    // nečitateľné. Nastav na 0, ak chceš vždy sťahovať všetko.
    var MINOR_ROADS_MIN_ZOOM = 16;
    var MINOR_ROAD_TYPES = [
        "footway", "path", "cycleway", "steps", "service", "track", "bridleway"
    ];

    // O koľko sa rozšíri sťahovaný bbox oproti výrezu. Pozor, pad() rozširuje
    // na KAŽDÚ stranu, takže 0.08 znamená ~1.35× väčšiu plochu (nie 1.08×).
    var BBOX_PADDING = 0.08;

    // Oneskorenie pred volaním Overpass po posune/zoome mapy
    var MOVE_DEBOUNCE_MS = 450;

    var STORAGE_KEY = "wmts.drawnItems.v1";

    // ---------------------------------------------------------------------
    // Inicializácia mapy
    // ---------------------------------------------------------------------
    var map = L.map('map', { maxZoom: MAP_MAX_ZOOM }).setView([48.9465, 20.5613], 13);

    // Základná podkladová vrstva (Freemap.sk)
    var baseLayer = L.tileLayer('https://ofmozaika.tiles.freemap.sk/{z}/{x}/{y}.jpg', {
        maxZoom: MAP_MAX_ZOOM,
        maxNativeZoom: FREEMAP_MAX_NATIVE_ZOOM,
        attribution: '&copy; <a href="https://freemap.sk">Freemap.sk</a>'
    }).addTo(map);

    // Ortofotografia vrstva (OrtoV1)
    var wmtsService = "https://tiles.arcgis.com/tiles/z9muuypGqZUVpznM/arcgis/rest/services/OrtoV1/MapServer";
    var wmtsUrl = wmtsService + "/tile/{z}/{y}/{x}";
    var wmtsLayer = L.tileLayer(wmtsUrl, {
        tileSize: 256,
        maxZoom: MAP_MAX_ZOOM,
        maxNativeZoom: ORTOV1_MAX_NATIVE_ZOOM,
        opacity: 1
    }).addTo(map);

    // Presný maxNativeZoom OrtoV1 zistíme z metadát dlaždicovej služby (LODs).
    // Ak sa to nepodarí, ostane predvolená hodnota.
    fetch(wmtsService + "?f=json")
        .then(function(response) { return response.json(); })
        .then(function(info) {
            var lods = info && info.tileInfo && info.tileInfo.lods;
            if (!lods || !lods.length) { return; }
            var maxLevel = lods.reduce(function(max, lod) {
                return Math.max(max, lod.level);
            }, 0);
            if (maxLevel > 0 && maxLevel !== wmtsLayer.options.maxNativeZoom) {
                wmtsLayer.options.maxNativeZoom = maxLevel;
                wmtsLayer.redraw();
            }
        })
        .catch(function() { /* metadáta nie sú dostupné – držíme sa predvolenej hodnoty */ });

    // Transparentná vrstva (OSM)
    var osmTransparentLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: MAP_MAX_ZOOM,
        maxNativeZoom: OSM_MAX_NATIVE_ZOOM,
        opacity: 0
    }).addTo(map);

    // ---------------------------------------------------------------------
    // Stavové hlásenia a indikátor načítania
    // ---------------------------------------------------------------------
    var loadingEl = document.getElementById('roads-loading');
    var loadingTextEl = document.getElementById('roads-loading-text');
    var messageEl = document.getElementById('map-message');
    var messageTimer = null;
    var loadingHintTimer = null;

    // Po dlhšej chvíli čakania dáme vedieť, že to nie je zamrznuté – len sa
    // čaká na pomalé pripojenie
    var LOADING_HINT_DELAY_MS = 8000;

    function showLoading(visible) {
        loadingEl.classList.toggle('visible', !!visible);
        clearTimeout(loadingHintTimer);

        if (visible) {
            loadingTextEl.textContent = "Načítavam cesty...";
            loadingHintTimer = setTimeout(function() {
                loadingTextEl.textContent = "Načítavam cesty... pripojenie je pomalé, chvíľu to potrvá";
            }, LOADING_HINT_DELAY_MS);
        }
    }

    function showMessage(text, type, autoHideMs) {
        clearTimeout(messageTimer);
        messageEl.textContent = text;
        messageEl.className = 'visible ' + (type || 'info');
        if (autoHideMs) {
            messageTimer = setTimeout(hideMessage, autoHideMs);
        }
    }

    function hideMessage() {
        clearTimeout(messageTimer);
        messageEl.className = '';
        messageEl.textContent = '';
    }

    // ---------------------------------------------------------------------
    // Posuvníky priehľadnosti (s live zobrazením hodnoty)
    // ---------------------------------------------------------------------
    function formatOpacity(value) {
        return Number(value).toFixed(1);
    }

    function bindOpacitySlider(inputId, valueId, onChange) {
        var input = document.getElementById(inputId);
        var valueEl = document.getElementById(valueId);

        function update() {
            valueEl.textContent = formatOpacity(input.value);
            onChange(parseFloat(input.value));
        }

        input.addEventListener('input', update);
        update();
    }

    bindOpacitySlider('opacity-osm', 'opacity-osm-value', function(value) {
        osmTransparentLayer.setOpacity(value);
    });

    bindOpacitySlider('opacity-ortov1', 'opacity-ortov1-value', function(value) {
        wmtsLayer.setOpacity(value);
    });

    // Priehľadnosť ciest – listener sa registruje LEN RAZ pri inicializácii,
    // nie vnútri loadRoads() (predtým vznikali duplicitné handlery).
    var roadsOpacity = 1;
    bindOpacitySlider('opacity-roads', 'opacity-roads-value', function(value) {
        roadsOpacity = value;
        if (roadsLayer) {
            roadsLayer.setStyle({ opacity: roadsOpacity });
        }
    });

    // Prepínač základnej podkladovej vrstvy (Freemap)
    document.getElementById('toggle-baselayer').addEventListener('change', function(e) {
        if (e.target.checked) {
            if (!map.hasLayer(baseLayer)) {
                baseLayer.addTo(map);
                baseLayer.bringToBack();
            }
        } else if (map.hasLayer(baseLayer)) {
            map.removeLayer(baseLayer);
        }
    });

    // Zbalenie/rozbalenie ovládacieho panela (dôležité hlavne na mobile)
    var controlsContainer = document.getElementById('controls-container');
    var controlsToggle = document.getElementById('controls-toggle');

    function setControlsCollapsed(collapsed) {
        controlsContainer.classList.toggle('collapsed', collapsed);
        controlsToggle.textContent = collapsed ? 'Ovládanie ▼' : 'Ovládanie ▲';
        controlsToggle.setAttribute('aria-expanded', String(!collapsed));
    }

    controlsToggle.addEventListener('click', function() {
        setControlsCollapsed(!controlsContainer.classList.contains('collapsed'));
    });

    // Na malých obrazovkách štartujeme zbalení
    setControlsCollapsed(window.innerWidth <= 600);

    // Kliky a scroll nad panelom nesmú ovládať mapu
    L.DomEvent.disableClickPropagation(controlsContainer);
    L.DomEvent.disableScrollPropagation(controlsContainer);

    // ---------------------------------------------------------------------
    // Štýly z OpenStreetMap (upravené)
    // ---------------------------------------------------------------------
    function osmStyle(feature) {
        var highway = feature.properties.highway || "default";

        var styles = {
            "primary": { color: "#f4f41a", weight: 6, opacity: 0.8 },
            "secondary": { color: "#f4f41a", weight: 4, opacity: 0.8 },
            "secondary_link": { color: "#f4f41a", weight: 4, opacity: 0.8 },
            "tertiary": { color: "#ffffff", weight: 3, opacity: 0.8 },
            "tertiary_link": { color: "#ffffff", weight: 3, opacity: 0.8 },
            "residential": { color: "#ffffff", weight: 2, opacity: 0.8 },
            "living_street": { color: "#ffffff", weight: 2, opacity: 0.8 },
            "unclassified": { color: "#ffffff", weight: 1.5, opacity: 0.8 },
            "service": { color: "#ffffff", weight: 1.5, opacity: 0.8 },
            "pedestrian": { color: "#fabada", weight: 1.5, opacity: 0.8 },
            "footway": { color: "#ff2929", weight: 1.5, dashArray: "4,4", opacity: 0.8 },
            "cycleway": { color: "#001dd6", weight: 1.5, dashArray: "4,4", opacity: 0.8 },
            "path": { color: "#855800", weight: 2, dashArray: "2,4", opacity: 0.8 },
            "steps": { color: "#ff0000", weight: 4, dashArray: "7,7", opacity: 0.8 },
            "track": { color: "#855800", weight: 2, opacity: 0.8 },
            "default": { color: "#808080", weight: 2, opacity: 0.8 }
        };

        var style = Object.assign({}, styles[highway] || styles["default"]);
        style.opacity = roadsOpacity;
        return style;
    }

    // ---------------------------------------------------------------------
    // Vrstvy pre cesty
    // ---------------------------------------------------------------------
    var roadsLayer;
    var roadsJob = null;

    // Rozsah, ktorý je momentálne načítaný (kvôli cache pri posune mapy)
    var loadedRoads = null;

    // Cesty kreslíme na canvas – SVG je pri tisíckach čiar veľmi pomalé
    var roadsRenderer = L.canvas({ padding: 0.3 });

    function cancelRoadsJob() {
        if (roadsJob) {
            roadsJob.cancelled = true;
            if (roadsJob.abort) { roadsJob.abort(); }
            roadsJob = null;
        }
    }

    // Plocha aktuálneho výrezu v km²
    function bboxAreaKm2(bounds) {
        var sw = bounds.getSouthWest();
        var ne = bounds.getNorthEast();
        var widthKm = map.distance(sw, L.latLng(sw.lat, ne.lng)) / 1000;
        var heightKm = map.distance(sw, L.latLng(ne.lat, sw.lng)) / 1000;
        return widthKm * heightKm;
    }

    // "Failed to fetch" (Chrome) / "NetworkError" (Firefox) / "Load failed"
    // (Safari) znamenajú, že spojenie neotvoril prehliadač – server o dopyte
    // vôbec nevedel. Príčina je v prostredí, nie v Overpasse.
    function isNetworkLevelError(reason) {
        return /failed to fetch|networkerror|load failed|network request failed/i.test(reason);
    }

    // Network Information API – podporuje ju Chrome/Edge na Androide,
    // Safari a Firefox ju nemajú, vtedy proste nevieme a sťahujeme normálne
    function getConnectionInfo() {
        return navigator.connection || navigator.mozConnection || navigator.webkitConnection || null;
    }

    function isSlowConnection() {
        var conn = getConnectionInfo();
        if (!conn) { return false; }
        if (conn.saveData) { return true; }
        return SLOW_CONNECTION_TYPES.indexOf(conn.effectiveType) !== -1;
    }

    // Keď vypršal časový limit na oboch zrkadlách, problém je takmer isto
    // v rýchlosti pripojenia, nie v Overpasse – "priblíž mapu" tu nepomôže,
    // bbox je väčšinou už dávno pod limitom
    function allTimedOut(err) {
        return !!err.reasons && err.reasons.every(function(r) {
            return /časový limit vypršal/.test(r);
        });
    }

    // Najpravdepodobnejšia príčina toho, že prehliadač spojenie neotvoril
    function diagnoseNetwork() {
        if (navigator.onLine === false) {
            return "Vyzerá to, že počítač nie je pripojený na internet.";
        }
        if (location.protocol === 'file:') {
            return "Stránka je otvorená priamo zo súboru (file://), preto prehliadač " +
                   "blokuje volania na Overpass API. Otvor ju cez webový server, " +
                   "napríklad z adresy github.io.";
        }
        return "Spojenie zablokoval prehliadač alebo sieť – najčastejšie blokovač " +
               "reklám, rozšírenie na ochranu súkromia, firewall alebo VPN.";
    }

    function shorten(text) {
        var clean = String(text).replace(/\s+/g, " ").trim();
        return clean.length > 160 ? clean.slice(0, 160) + "…" : clean;
    }

    // Krátky názov zrkadla do hlásenia (celé URL je zbytočne dlhé)
    function endpointName(endpoint) {
        return endpoint.split("/")[2];
    }

    // Z HTML/textovej chybovej odpovede Overpassu vytiahne užitočnú vetu
    function describeOverpassError(body) {
        if (!body) { return ""; }
        var match = String(body).match(/(rate_limited|too many requests|Query timed out[^<]*|runtime error[^<]*|error[^<]{0,120})/i);
        return match ? " – " + shorten(match[0]) : "";
    }

    // Volanie jedného Overpass zrkadla s vlastným timeoutom
    function fetchOverpassEndpoint(endpoint, query, controller) {
        var timedOut = false;
        var timer = setTimeout(function() {
            timedOut = true;
            controller.abort();
        }, OVERPASS_TIMEOUT_MS);

        return fetch(endpoint + "?data=" + encodeURIComponent(query), { signal: controller.signal })
            .then(function(response) {
                clearTimeout(timer);
                if (!response.ok) {
                    // Overpass posiela dôvod (preťaženie, prekročený limit)
                    // v tele odpovede – bez neho sa chyba nedá diagnostikovať
                    return response.text().then(function(body) {
                        throw new Error("HTTP " + response.status + describeOverpassError(body));
                    }, function() {
                        throw new Error("HTTP " + response.status);
                    });
                }
                return response.json();
            })
            .then(function(data) {
                // Pri chybe počas výpočtu vráti Overpass kód 200 a prázdny
                // zoznam prvkov s vysvetlením v poli "remark".
                if (data && data.remark && /error/i.test(data.remark)) {
                    throw new Error(shorten(data.remark));
                }
                return { endpoint: endpoint, data: data };
            })
            .catch(function(err) {
                clearTimeout(timer);
                err.endpoint = endpoint;
                err.timedOut = timedOut;
                throw err;
            });
    }

    // Všetky zrkadlá naraz – vyhráva prvá úspešná odpoveď, zvyšné sa zrušia.
    // Chyba sa vráti až keď zlyhajú všetky.
    function fetchOverpass(query, job) {
        var controllers = OVERPASS_ENDPOINTS.map(function() { return new AbortController(); });

        job.abort = function() {
            controllers.forEach(function(c) { c.abort(); });
        };

        return new Promise(function(resolve, reject) {
            var settled = false;
            var reasons = [];

            OVERPASS_ENDPOINTS.forEach(function(endpoint, i) {
                fetchOverpassEndpoint(endpoint, query, controllers[i])
                    .then(function(result) {
                        if (settled) { return; }
                        settled = true;

                        // Prvý úspešný vyhral – ostatné požiadavky zrušíme
                        controllers.forEach(function(c, j) {
                            if (j !== i) { c.abort(); }
                        });
                        resolve(result);
                    })
                    .catch(function(err) {
                        // Zrušené po výhre iného zrkadla alebo novším požiadavkom
                        if (settled || job.cancelled) { return; }

                        var reason = err.timedOut ? "časový limit vypršal" : err.message;
                        console.warn("Overpass zrkadlo zlyhalo (" + endpoint + "): " + reason);

                        // Zbierame dôvody zo VŠETKÝCH zrkadiel – pri poslednom
                        // dôvode sa nedá zistiť, čo vlastne zlyhalo
                        reasons.push(endpointName(endpoint) + ": " + reason);

                        if (reasons.length === OVERPASS_ENDPOINTS.length) {
                            settled = true;
                            var error = new Error(reasons.join(", "));
                            error.reasons = reasons;
                            reject(error);
                        }
                    });
            });
        });
    }

    // Overpass vracia pri "out geom" priamo geometriu ways, takže ich vieme
    // previesť na GeoJSON sami – je to výrazne rýchlejšie než osmtogeojson,
    // ktorý navyše rieši relácie, aké tento dopyt nevracia.
    function overpassToGeoJSON(data) {
        var elements = (data && data.elements) || [];
        var features = [];
        var hasOther = false;

        elements.forEach(function(el) {
            if (el.type !== 'way' || !el.geometry) {
                hasOther = true;
                return;
            }

            var coordinates = [];
            el.geometry.forEach(function(point) {
                // Neúplná geometria na okraji bboxu obsahuje null-y
                if (point) { coordinates.push([point.lon, point.lat]); }
            });
            if (coordinates.length < 2) { return; }

            features.push({
                type: 'Feature',
                id: 'way/' + el.id,
                properties: el.tags || {},
                geometry: { type: 'LineString', coordinates: coordinates }
            });
        });

        // Ak by dopyt niekedy vrátil aj iné typy, necháme to na osmtogeojson
        if (hasOther && typeof osmtogeojson === 'function') {
            return osmtogeojson(data);
        }

        return { type: 'FeatureCollection', features: features };
    }

    // Dopyt pre daný výrez. Pri oddialení vynecháme drobné cesty – tvoria
    // väčšinu dát a sú hlavným dôvodom pomalých odpovedí.
    function buildRoadsQuery(bounds, includeMinor) {
        var bbox = [bounds.getSouth(), bounds.getWest(), bounds.getNorth(), bounds.getEast()].join(",");
        var timeoutSec = Math.round(OVERPASS_TIMEOUT_MS / 1000);
        var filter = includeMinor
            ? ''
            : '["highway"!~"^(' + MINOR_ROAD_TYPES.join("|") + ')$"]';

        return `
            [out:json][timeout:${timeoutSec}];
            way["highway"]${filter}(${bbox});
            out geom;`;
    }

    // Funkcia na načítanie ciest cez Overpass API
    function loadRoads(force) {
        var bbox = map.getBounds();
        var includeMinor = map.getZoom() >= MINOR_ROADS_MIN_ZOOM && !isSlowConnection();

        // Sťahujeme o niečo väčšie územie, než je vidieť, aby malý posun
        // mapy nespustil nové volanie Overpassu
        var requestBounds = bbox.pad(BBOX_PADDING);

        // Kontrola veľkosti – rozhoduje plocha, ktorú reálne pýtame od
        // Overpassu, nie len viditeľný výrez
        var areaLimit = includeMinor ? MAX_BBOX_AREA_KM2 : MAX_BBOX_AREA_KM2_MAJOR;
        if (bboxAreaKm2(requestBounds) > areaLimit) {
            cancelRoadsJob();
            showLoading(false);
            if (roadsLayer) {
                map.removeLayer(roadsLayer);
                roadsLayer = null;
            }
            loadedRoads = null;
            showMessage("Priblíž mapu pre zobrazenie ciest", "info");
            return;
        }

        // Už načítané dáta pokrývajú tento výrez – nesťahujeme znova
        if (!force && loadedRoads &&
            loadedRoads.includeMinor === includeMinor &&
            loadedRoads.bounds.contains(bbox)) {
            return;
        }

        // Zrušenie predchádzajúceho, ešte bežiaceho požiadavku
        cancelRoadsJob();

        var job = { cancelled: false, abort: null };
        roadsJob = job;

        hideMessage();
        showLoading(true);

        runRoadsQuery(requestBounds, includeMinor, job);
    }

    // Jeden pokus o stiahnutie a vykreslenie ciest. Ak zlyhá s plným
    // dopytom, skúsi sa raz zopakovať len s hlavnými cestami – odľahčený
    // dopyt často prejde aj tam, kde plný nestihne časový limit.
    function runRoadsQuery(requestBounds, includeMinor, job) {
        fetchOverpass(buildRoadsQuery(requestBounds, includeMinor), job)
            .then(function(result) {
                if (job.cancelled) { return; }

                var geojsonData = overpassToGeoJSON(result.data);

                // Odstrániť starú vrstvu ciest
                if (roadsLayer) {
                    map.removeLayer(roadsLayer);
                }

                roadsLayer = L.geoJSON(geojsonData, {
                    // Canvas zvláda tisíce čiar oveľa rýchlejšie než SVG
                    renderer: roadsRenderer,
                    style: osmStyle,
                    onEachFeature: function(feature, layer) {
                        if (feature.properties && feature.properties.name) {
                            layer.bindPopup(`<strong>${feature.properties.name}</strong><br>${feature.properties.highway || "unknown type"}`);
                        }
                    }
                }).addTo(map);

                loadedRoads = { bounds: requestBounds, includeMinor: includeMinor };

                showLoading(false);
                roadsJob = null;

                if (!geojsonData.features.length) {
                    showMessage("V tomto výreze nie sú žiadne cesty.", "info", 4000);
                } else if (!includeMinor) {
                    showMessage("Zobrazené sú len hlavné cesty. Priblíž mapu pre chodníky a poľné cesty.", "info", 4000);
                }
            })
            .catch(function(err) {
                if (job.cancelled || err.name === 'AbortError') { return; }

                console.error("Chyba pri načítaní ciest:", err.message);

                // Druhý pokus s odľahčeným dopytom
                if (includeMinor) {
                    console.warn("Skúšam znova len s hlavnými cestami.");
                    runRoadsQuery(requestBounds, false, job);
                    return;
                }

                showLoading(false);

                var hint;
                if (isNetworkLevelError(err.message)) {
                    // Sieťová chyba nie je problém Overpassu – približovanie
                    // mapy ani opakovanie na nej nič nezmenia
                    hint = diagnoseNetwork();
                } else if (allTimedOut(err)) {
                    hint = "Vyzerá to na pomalé pripojenie (slabý signál, preplnená Wi-Fi). " +
                           "Skús to znova, keď bude sieť rýchlejšia, alebo sa presuň bližšie k zdroju signálu.";
                } else {
                    hint = "Skús priblížiť mapu alebo tlačidlo „Načítať cesty“.";
                }

                showMessage("Cesty sa nepodarilo načítať. " + err.message + ". " + hint, "error");
                roadsJob = null;
            });
    }

    // Debounce – Overpass nevoláme pri každom medzikroku posunu/zoomu
    function debounce(fn, wait) {
        var timer = null;
        return function() {
            clearTimeout(timer);
            timer = setTimeout(fn, wait);
        };
    }

    // Načítanie ciest pri zmene mapy
    map.on('moveend', debounce(loadRoads, MOVE_DEBOUNCE_MS));

    // Manuálne vynútené znovunačítanie (obíde cache, hodí sa po chybe)
    document.getElementById('reload-roads').addEventListener('click', function() {
        loadRoads(true);
    });

    loadRoads();

    // ---------------------------------------------------------------------
    // Vrstvy na kreslenie
    // ---------------------------------------------------------------------
    var drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    // Uloženie/načítanie kresieb z localStorage
    function saveDrawnItems() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(drawnItems.toGeoJSON()));
        } catch (err) {
            console.warn("Kresby sa nepodarilo uložiť do localStorage:", err);
        }
    }

    function restoreDrawnItems() {
        var raw;
        try {
            raw = localStorage.getItem(STORAGE_KEY);
        } catch (err) {
            console.warn("localStorage nie je dostupný:", err);
            return;
        }
        if (!raw) { return; }

        try {
            var saved = JSON.parse(raw);
            L.geoJSON(saved, {
                pointToLayer: function(feature, latlng) {
                    return L.marker(latlng);
                }
            }).eachLayer(function(layer) {
                drawnItems.addLayer(layer);
            });
        } catch (err) {
            console.warn("Uložené kresby sa nepodarilo načítať:", err);
        }
    }

    restoreDrawnItems();

    var drawControl = new L.Control.Draw({
        edit: {
            featureGroup: drawnItems,
            remove: true
        },
        draw: {
            polyline: true,
            polygon: true,
            circle: false,
            marker: true,
            rectangle: true
        }
    });
    map.addControl(drawControl);

    // Udalosť po nakreslení prvku
    map.on('draw:created', function(e) {
        var layer = e.layer;
        drawnItems.addLayer(layer);
        saveDrawnItems();
    });

    map.on('draw:edited', saveDrawnItems);
    map.on('draw:deleted', saveDrawnItems);

    // Vymazanie všetkých kresieb
    document.getElementById('clear-drawings').addEventListener('click', function() {
        if (!drawnItems.getLayers().length) {
            showMessage("Nie sú žiadne kresby na vymazanie.", "info", 3000);
            return;
        }
        if (!confirm("Naozaj vymazať všetky nakreslené prvky?")) { return; }
        drawnItems.clearLayers();
        saveDrawnItems();
        showMessage("Kresby boli vymazané.", "info", 3000);
    });

    // ---------------------------------------------------------------------
    // Export
    // ---------------------------------------------------------------------
    function downloadFile(content, mimeType, fileName) {
        var dataStr = "data:" + mimeType + ";charset=utf-8," + encodeURIComponent(content);
        var downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", fileName);
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    }

    // Export do GeoJSON
    document.getElementById('export-geojson').addEventListener('click', function() {
        if (!drawnItems.getLayers().length) {
            showMessage("Nie sú žiadne kresby na export.", "info", 3000);
            return;
        }
        var data = drawnItems.toGeoJSON();
        downloadFile(JSON.stringify(data), "text/json", "map_data.geojson");
    });

    // Export do GPX
    function escapeXml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    // Z geometrie vytiahne zoznam bodov (wpt) a zoznam línií (trkseg)
    function collectGpxParts(geometry, points, lines) {
        if (!geometry) { return; }
        switch (geometry.type) {
            case 'Point':
                points.push(geometry.coordinates);
                break;
            case 'MultiPoint':
                geometry.coordinates.forEach(function(c) { points.push(c); });
                break;
            case 'LineString':
                lines.push(geometry.coordinates);
                break;
            case 'MultiLineString':
                geometry.coordinates.forEach(function(line) { lines.push(line); });
                break;
            case 'Polygon':
                geometry.coordinates.forEach(function(ring) { lines.push(ring); });
                break;
            case 'MultiPolygon':
                geometry.coordinates.forEach(function(polygon) {
                    polygon.forEach(function(ring) { lines.push(ring); });
                });
                break;
            case 'GeometryCollection':
                geometry.geometries.forEach(function(g) { collectGpxParts(g, points, lines); });
                break;
        }
    }

    function drawnItemsToGpx() {
        var geojson = drawnItems.toGeoJSON();
        var gpx = [];
        gpx.push('<?xml version="1.0" encoding="UTF-8"?>');
        gpx.push('<gpx version="1.1" creator="Mapa s kreslenim, cestami a exportom" xmlns="http://www.topografix.com/GPX/1/1">');

        var pointIndex = 0;
        var trackIndex = 0;

        geojson.features.forEach(function(feature) {
            var points = [];
            var lines = [];
            collectGpxParts(feature.geometry, points, lines);

            var name = feature.properties && feature.properties.name;

            points.forEach(function(coords) {
                pointIndex++;
                gpx.push('  <wpt lat="' + coords[1] + '" lon="' + coords[0] + '">');
                gpx.push('    <name>' + escapeXml(name || ('Bod ' + pointIndex)) + '</name>');
                if (coords.length > 2) {
                    gpx.push('    <ele>' + coords[2] + '</ele>');
                }
                gpx.push('  </wpt>');
            });

            lines.forEach(function(coordsList) {
                if (coordsList.length < 2) { return; }
                trackIndex++;
                gpx.push('  <trk>');
                gpx.push('    <name>' + escapeXml(name || ('Trasa ' + trackIndex)) + '</name>');
                gpx.push('    <trkseg>');
                coordsList.forEach(function(coords) {
                    gpx.push('      <trkpt lat="' + coords[1] + '" lon="' + coords[0] + '">' +
                        (coords.length > 2 ? '<ele>' + coords[2] + '</ele>' : '') + '</trkpt>');
                });
                gpx.push('    </trkseg>');
                gpx.push('  </trk>');
            });
        });

        gpx.push('</gpx>');
        return gpx.join('\n');
    }

    document.getElementById('export-gpx').addEventListener('click', function() {
        if (!drawnItems.getLayers().length) {
            showMessage("Nie sú žiadne kresby na export.", "info", 3000);
            return;
        }
        downloadFile(drawnItemsToGpx(), "application/gpx+xml", "map_data.gpx");
    });
</script>

</body>
</html>
